<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitOps Master Project - Voting App</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #777; margin-bottom: 30px; font-size: 0.9em; }
        .btn-container { display: flex; justify-content: space-around; margin-bottom: 25px; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s; font-weight: bold; }
        button:active { transform: scale(0.95); }
        .btn-gitops { background-color: #f05032; color: white; }
        .btn-devops { background-color: #007acc; color: white; }
        .results { background: #fafafa; border-radius: 8px; padding: 15px; margin-top: 20px; text-align: left; }
        .progress-bar { background: #eee; border-radius: 4px; height: 12px; width: 100%; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; width: 50%; transition: width 0.3s; }
        .fill-gitops { background-color: #f05032; }
        .fill-devops { background-color: #007acc; }
        .stat-line { display: flex; justify-content: space-between; margin-top: 15px; font-weight: 500; color: #444; }
    </style>
</head>
<body>
    <div class="card">
        <h1>What is better?</h1>
        <div class="subtitle">GitOps vs DevOps Real-Time Voting Engine</div>
        <div class="btn-container">
            <button class="btn-gitops" onclick="castVote('gitops')">GitOps</button>
            <button class="btn-devops" onclick="castVote('devops')">DevOps</button>
        </div>
        <div class="results">
            <div class="stat-line">
                <span>GitOps: <span id="count-gitops">0</span> votes</span>
                <span id="pct-gitops">50%</span>
            </div>
            <div class="progress-bar"><div id="bar-gitops" class="progress-fill fill-gitops"></div></div>
            <div class="stat-line">
                <span>DevOps: <span id="count-devops">0</span> votes</span>
                <span id="pct-devops">50%</span>
            </div>
            <div class="progress-bar"><div id="bar-devops" class="progress-fill fill-devops"></div></div>
        </div>
    </div>
    <script>
        function updateUI() {
            fetch('/api/results')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('count-gitops').innerText = data.gitops;
                    document.getElementById('count-devops').innerText = data.devops;
                    const total = data.gitops + data.devops;
                    const gitopsPct = total === 0 ? 50 : Math.round((data.gitops / total) * 100);
                    const devopsPct = total === 0 ? 50 : Math.round((data.devops / total) * 100);
                    document.getElementById('pct-gitops').innerText = gitopsPct + '%';
                    document.getElementById('pct-devops').innerText = devopsPct + '%';
                    document.getElementById('bar-gitops').style.width = gitopsPct + '%';
                    document.getElementById('bar-devops').style.width = devopsPct + '%';
                });
        }
        function castVote(team) {
            fetch('/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ team: team })
            }).then(() => updateUI());
        }
        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
